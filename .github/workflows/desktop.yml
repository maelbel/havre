# Havre Desktop: builds the installers for Windows, macOS and Linux.
#
# - On every push touching desktop/ (or by hand from the Actions tab): the
#   installers are attached to the run as artifacts (Actions › the run ›
#   Artifacts).
# - On a tag like `desktop-v0.1.0`: also a draft GitHub release with them.
#
# The apps are not code-signed yet: Windows SmartScreen and macOS
# Gatekeeper warn on first launch (see desktop/README.md).
name: Desktop

on:
  push:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (WebKitGTK, tray)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest            # Apple silicon
            args: "--target aarch64-apple-darwin"
          - os: macos-latest            # Intel Macs (cross-built)
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04            # oldest glibc we support: runs on newer too
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: pnpm/action-setup@v4
        with: { package_json_file: desktop/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: desktop/pnpm-lock.yaml }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri, key: "${{ matrix.args }}" }
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          # Only for tags: a draft release you publish yourself.
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: "Havre Desktop ${{ github.ref_name }}"
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: havre-desktop-${{ runner.os }}${{ contains(matrix.args, 'x86_64') && '-intel' || '' }}
          path: |
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
            desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error
